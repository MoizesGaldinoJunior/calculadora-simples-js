<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora em JS</title>
</head>
<body>
    <main>
        <div class="display">
            <input type="text" class="display__content" id="display" disabled>
        </div>
        <div class="keyboard">
            <button class="keyboard__key equal" data-value="=">=</button>
            <button class="keyboard__key" data-value="7">7</button>
            <button class="keyboard__key" data-value="8">8</button>
            <button class="keyboard__key" data-value="9">9</button>
            <button class="keyboard__key operator" data-value="/">/</button>
            <button class="keyboard__key" data-value="4">4</button>
            <button class="keyboard__key" data-value="5">5</button>
            <button class="keyboard__key" data-value="6">6</button>
            <button class="keyboard__key operator" data-value="*">*</button>
            <button class="keyboard__key" data-value="1">1</button>
            <button class="keyboard__key" data-value="2">2</button>
            <button class="keyboard__key" data-value="3">3</button>
            <button class="keyboard__key operator" data-value="-">-</button>
            <button class="keyboard__key clear" data-value="C">C</button>
            <button class="keyboard__key" data-value="0">0</button>
            <button class="keyboard__key" data-value=".">.</button>
            <button class="keyboard__key operator" data-value="+">+</button> <!--O data-value armazena o valor correspondente-->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
